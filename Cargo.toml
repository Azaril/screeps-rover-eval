[package]
name = "screeps-rover-eval"
version = "0.1.0"
authors = ["William Archbell <william@archbell.com>"]
edition = "2021"
description = "Offline simulator + benchmark for screeps-rover (ADR 0033): drive the REAL rover LocalPathfinder / MovementSystem over a screeps-sim-core movement world, and gate pathing quality (route optimality, fatigue efficiency, congestion) + algorithmic/ops CPU against a ground-truth oracle. Host-only; reuses the sim-core kernel (no re-ported physics)."

# A host-only workspace MEMBER (the measurement layer). Excluded from the wasm build aliases in
# .cargo/config.toml. Git deps redirected to local member paths by the root [patch] table.

[dependencies]
screeps-game-api = "0.23"
# The shared movement kernel (world + terrain + body + the mover). The `rover` feature pulls the
# offline `MovementSystem` driver (`resolve_moves_via_system`) that the Tier-B crowd sim drives.
screeps-sim-core = { git = "https://github.com/Azaril/screeps-sim-core", features = ["rover"] }
# The pathfinder + Dijkstra oracle UNDER TEST (pure/offline build — no `screeps` feature).
screeps-rover = { git = "https://github.com/Azaril/screeps-rover" }
# Real-terrain machinery REUSE (ADR 0033 §D2/§D6): combat-eval's committed real mmo:shard3 room
# fixtures (`terrain_import::fixtures`) + the verified column-major terrain decoder. The C-family
# base-traffic scenarios plan foreman bases over these fixtures via the `capture_layout` bin.
screeps-combat-eval = { git = "https://github.com/Azaril/screeps-combat-eval" }
# The §D5.4 decision-(5) bridge (annotate.rs): the REAL force-sizing / objective-value kernels that
# pre-price GoalAnnotations — the ONE sanctioned meeting point of the movement bench and the combat
# stack (harness layer; value.rs itself stays combat-dep-free). Redirected by the root [patch].
screeps-combat-decision = { git = "https://github.com/Azaril/screeps-combat-decision" }
# The foreman room planner (offline, SLOW — ~4–60s/room) — run ONCE by the `capture_layout` bin to
# plan realistic bases (incl. the roads/containers/storage combat-eval's `CapturedBase` drops) into
# the committed `resources/captured-layouts.json` cache; never planned at test time.
screeps-foreman = { git = "https://github.com/Azaril/screeps-foreman" }
screeps-common = { git = "https://github.com/Azaril/screeps-common" }
# The committed layout cache (same committed-fixture pattern as combat-eval, ADR 0025 §12 Stage 3a).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
